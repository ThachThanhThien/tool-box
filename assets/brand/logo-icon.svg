<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="iconPrimaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="iconCubeTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="iconCubeLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#3730a3" />
    </linearGradient>
    <linearGradient id="iconCubeRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>
  </defs>

  <!-- Hexagonal Modular Cube Mark -->
  <polygon points="32,4 58,19 58,49 32,64 6,49 6,19" fill="#0f172a" stroke="url(#iconPrimaryGrad)" stroke-width="2"/>

  <!-- Top Face -->
  <polygon points="32,7 55,20 32,33 9,20" fill="url(#iconCubeTop)" />
  <!-- Left Face -->
  <polygon points="9,20 32,33 32,60 9,47" fill="url(#iconCubeLeft)" />
  <!-- Right Face -->
  <polygon points="32,33 55,20 55,47 32,60" fill="url(#iconCubeRight)" />

  <!-- Code Bracket on Left Face -->
  <path d="M22,39 L17,43 L22,47" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Utility Arrow on Right Face -->
  <path d="M42,39 L47,43 L42,47" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Central Precision Core Node -->
  <circle cx="32" cy="33" r="3" fill="#ffffff" />
</svg>
