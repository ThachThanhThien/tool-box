<app-page-header
  header="QR Code Generator"
  category="Image &amp; Media"
  description="Generate customized, high-contrast QR codes for websites, WiFi networks, emails, contact cards, and text with instant download."
  badge="Popular">
</app-page-header>

<div class="qr-hub-container fade-in">
  <!-- Presets Bar -->
  <div class="tool-workspace-card mb-4">
    <label class="form-label-sm mb-2">Select Content Type:</label>
    <div class="preset-types-bar">
      <button
        type="button"
        class="type-btn"
        [class.active]="presetType === 'url'"
        (click)="setPreset('url')">
        <i class="fa-solid fa-link me-1"></i> Website URL
      </button>
      <button
        type="button"
        class="type-btn"
        [class.active]="presetType === 'text'"
        (click)="setPreset('text')">
        <i class="fa-solid fa-align-left me-1"></i> Plain Text
      </button>
      <button
        type="button"
        class="type-btn"
        [class.active]="presetType === 'wifi'"
        (click)="setPreset('wifi')">
        <i class="fa-solid fa-wifi me-1"></i> WiFi Network
      </button>
      <button
        type="button"
        class="type-btn"
        [class.active]="presetType === 'email'"
        (click)="setPreset('email')">
        <i class="fa-regular fa-envelope me-1"></i> Email
      </button>
      <button
        type="button"
        class="type-btn"
        [class.active]="presetType === 'phone'"
        (click)="setPreset('phone')">
        <i class="fa-solid fa-phone me-1"></i> Phone
      </button>
    </div>
  </div>

  <div class="row g-4">
    <!-- Left: Content & Style Inputs -->
    <div class="col-lg-7 col-12">
      <div class="tool-workspace-card">
        <h3 class="panel-heading mb-3">Content Configuration</h3>

        <!-- Dynamic Inputs Based on Type -->
        @if (presetType === 'url') {
          <div class="mb-3">
            <label class="form-label-sm">Destination URL:</label>
            <input
              type="url"
              class="form-control-custom"
              [(ngModel)]="urlInput"
              (ngModelChange)="updateQrData()"
              placeholder="https://example.com">
          </div>
        }

        @if (presetType === 'text') {
          <div class="mb-3">
            <label class="form-label-sm">Message Content:</label>
            <textarea
              class="form-control-custom"
              rows="4"
              [(ngModel)]="textInput"
              (ngModelChange)="updateQrData()"
              placeholder="Enter text to encode in QR code...">
            </textarea>
          </div>
        }

        @if (presetType === 'wifi') {
          <div class="row g-3 mb-3">
            <div class="col-md-6 col-12">
              <label class="form-label-sm">Network Name (SSID):</label>
              <input
                type="text"
                class="form-control-custom"
                [(ngModel)]="wifiSsid"
                (ngModelChange)="updateQrData()">
            </div>
            <div class="col-md-6 col-12">
              <label class="form-label-sm">Password:</label>
              <input
                type="text"
                class="form-control-custom"
                [(ngModel)]="wifiPassword"
                (ngModelChange)="updateQrData()">
            </div>
            <div class="col-12">
              <label class="form-label-sm">Encryption Type:</label>
              <select
                class="form-control-custom"
                [(ngModel)]="wifiEncryption"
                (ngModelChange)="updateQrData()">
                <option value="WPA">WPA/WPA2/WPA3 (Standard)</option>
                <option value="WEP">WEP</option>
                <option value="nopass">None (Open Network)</option>
              </select>
            </div>
          </div>
        }

        @if (presetType === 'email') {
          <div class="row g-3 mb-3">
            <div class="col-12">
              <label class="form-label-sm">Recipient Email:</label>
              <input
                type="email"
                class="form-control-custom"
                [(ngModel)]="emailAddress"
                (ngModelChange)="updateQrData()">
            </div>
            <div class="col-12">
              <label class="form-label-sm">Subject Line:</label>
              <input
                type="text"
                class="form-control-custom"
                [(ngModel)]="emailSubject"
                (ngModelChange)="updateQrData()">
            </div>
          </div>
        }

        @if (presetType === 'phone') {
          <div class="mb-3">
            <label class="form-label-sm">Phone Number:</label>
            <input
              type="tel"
              class="form-control-custom"
              [(ngModel)]="phoneNumber"
              (ngModelChange)="updateQrData()"
              placeholder="+1 555-0199">
          </div>
        }

        <hr class="my-4" style="border-color: var(--border-subtle);">

        <!-- Visual Style Customization -->
        <h3 class="panel-heading mb-3">Appearance &amp; Colors</h3>

        <div class="row g-3 mb-3">
          <div class="col-6">
            <label class="form-label-sm">Dot Pattern Color:</label>
            <div class="d-flex align-items-center gap-2">
              <input type="color" class="color-picker-input" [(ngModel)]="colorDark">
              <span class="font-mono text-secondary" style="font-size: 13px;">{{ colorDark }}</span>
            </div>
          </div>
          <div class="col-6">
            <label class="form-label-sm">Background Color:</label>
            <div class="d-flex align-items-center gap-2">
              <input type="color" class="color-picker-input" [(ngModel)]="colorLight">
              <span class="font-mono text-secondary" style="font-size: 13px;">{{ colorLight }}</span>
            </div>
          </div>
        </div>

        <!-- Size Slider -->
        <div class="mb-3">
          <div class="d-flex align-items-center justify-content-between mb-1">
            <label class="form-label-sm">Preview Size:</label>
            <span class="font-mono text-muted" style="font-size: 12px;">{{ qrSize }}px</span>
          </div>
          <mat-slider min="140" max="360" step="10" class="w-100">
            <input matSliderThumb [(ngModel)]="qrSize">
          </mat-slider>
        </div>
      </div>
    </div>

    <!-- Right: Live Preview & Export -->
    <div class="col-lg-5 col-12">
      <div class="tool-workspace-card text-center h-100 d-flex flex-column align-items-center justify-content-between">
        <div>
          <h3 class="panel-heading mb-3">Live QR Preview</h3>
          <div class="qr-canvas-holder mb-3" #qrcode [style.background]="colorLight">
            <qrcode
              [qrdata]="value"
              [colorDark]="colorDark"
              [colorLight]="colorLight"
              [width]="qrSize"
              [errorCorrectionLevel]="errorCorrectionLevel">
            </qrcode>
          </div>
          <p class="font-mono text-muted text-break" style="font-size: 11px; max-width: 320px;">
            Payload: {{ value }}
          </p>
        </div>

        <div class="export-actions-row w-100 mt-3 pt-3 border-top">
          <button type="button" class="btn-primary w-100 mb-2" (click)="downloadPng()">
            <i class="fa-solid fa-download"></i>
            <span>Download PNG Image</span>
          </button>
          <button type="button" class="btn-secondary w-100" (click)="copyContent()">
            <i class="fa-regular fa-copy"></i>
            <span>Copy QR Payload</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
