<div
  class="modern-uploader-container"
  [class.dragging]="isDragging"
  (dragover)="onDragOver($event)"
  (dragleave)="onDragLeave($event)"
  (drop)="onDrop($event)"
  (click)="fileInput.click()">

  <input
    #fileInput
    class="d-none"
    type="file"
    (change)="onFileChosen($event)"
    [accept]="acceptFile"
    [multiple]="multiple"/>

  <div class="uploader-inner">
    <div class="uploader-icon-wrap">
      <i class="fa-solid fa-cloud-arrow-up"></i>
    </div>
    <h4 class="uploader-title">{{ title }}</h4>
    <p class="uploader-desc">{{ description }}</p>
    <button type="button" class="btn-secondary btn-sm mt-2">
      <i class="fa-solid fa-folder-open me-1"></i> Browse Files
    </button>
  </div>

  @if (fileList.length > 0) {
    <div class="selected-files-list mt-3" (click)="$event.stopPropagation()">
      @for (f of fileList; track f.name) {
        <div class="file-chip">
          <i class="fa-regular fa-file me-1"></i>
          <span class="file-name text-truncate">{{ f.name }}</span>
          <span class="file-size font-mono">({{ formatSize(f.size) }})</span>
        </div>
      }
    </div>
  }
</div>
