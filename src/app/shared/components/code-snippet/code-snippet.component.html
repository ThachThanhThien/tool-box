<div class="code-block-wrapper">
  <div class="code-header">
    <div class="d-flex align-items-center gap-2">
      <span class="code-lang-pill">{{ language }}</span>
      @if (title) {
        <span class="code-title">{{ title }}</span>
      }
    </div>
    <button (click)="copy()" class="copy-btn" [class.copied]="copied" type="button" title="Copy code">
      <i [class]="copied ? 'fa-solid fa-check text-success' : 'fa-regular fa-copy'"></i>
      <span>{{ copied ? 'Copied!' : 'Copy Code' }}</span>
    </button>
  </div>
  <pre class="code-pre"><code [class]="language" [innerHTML]="formattedCode"></code></pre>
</div>
